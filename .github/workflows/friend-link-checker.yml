name: 🤝 自动更新友链

concurrency:
  group: friend-request-updates
  cancel-in-progress: false

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

jobs:
  update-friends:
    outputs:
      changed: ${{ steps.process.outputs.changed }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Process friend request
        id: process
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = require('node:path');
            const handler = require(path.join(process.env.GITHUB_WORKSPACE, '.github/scripts/process-friend-request.cjs'));
            const result = await handler({ github, context, core });
            core.setOutput('changed', result?.changed === true ? 'true' : 'false');

  refresh-friend-report:
    needs: update-friends
    if: needs.update-friends.outputs.changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/friend-link-check.yml
    secrets: inherit
